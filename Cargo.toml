[package]
name = "cbrec"
version = "0.0.2"
edition = "2021"
authors = ["Duna-tools"]
description = "Simple and efficient stream recorder"
license = "MIT"
repository = "https://github.com/Duna-tools/cbrec"
homepage = "https://github.com/Duna-tools/cbrec"

[package.metadata]
# Contact info used by packaging tools when available
maintainer = "Duna-tools"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream", "rustls-tls"] }
url = "2.5"
colored = "3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.0.6", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
base64 = "0.23"
lru = "0.19.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# Bytes
bytes = "1.5"
libc = "0.2.180"
directories = "6.0"
fs4 = "1"
quick-m3u8 = "0.8"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
# El poll alternativo evita perder teclado al coincidir entrada y resize en Mio.
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Duna-tools"
depends = "$auto, ffmpeg"
section = "video"
priority = "optional"
assets = [
  ["target/release/cbrec", "usr/bin/cbrec", "755"],
  ["README.md", "usr/share/doc/cbrec/README.md", "644"],
  ["LICENSE", "usr/share/doc/cbrec/LICENSE", "644"],
]

[package.metadata.generate-rpm]
license = "MIT"
summary = "Simple and efficient stream recorder"
assets = [
  { source = "target/release/cbrec", dest = "/usr/bin/cbrec", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/cbrec/README.md", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/doc/cbrec/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
ffmpeg = "*"
